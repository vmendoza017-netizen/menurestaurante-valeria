<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras Interactivo</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="text-center mb-4">🛒 Carrito de Compras</h1>

  <!-- Productos -->
  <div class="row row-cols-1 row-cols-md-5 g-4">
    <div class="col">
      <div class="card h-100">
        <img src="dior.webp" class="card-img-top" alt="Producto 1">
        <div class="card-body text-center">
          <h5 class="card-title">Producto 1</h5>
          <button class="btn btn-success add-btn">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100">
        <img src="corrector.avif" class="card-img-top" alt="Producto 2">
        <div class="card-body text-center">
          <h5 class="card-title">Producto 2</h5>
          <button class="btn btn-success add-btn">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100">
        <img src="gloss.webp" class="card-img-top" alt="Producto 3">
        <div class="card-body text-center">
          <h5 class="card-title">Producto 3</h5>
          <button class="btn btn-success add-btn">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100">
        <img src="polvo.avif" class="card-img-top" alt="Producto 4">
        <div class="card-body text-center">
          <h5 class="card-title">Producto 4</h5>
          <button class="btn btn-success add-btn">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100">
        <img src="fijadorr.avif" class="card-img-top" alt="Producto 5">
        <div class="card-body text-center">
          <h5 class="card-title">Producto 5</h5>
          <button class="btn btn-success add-btn">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Carrito -->
  <div class="mt-5">
    <h3>Carrito:</h3>
    <ul id="cart-list" class="list-group"></ul>
    <button id="remove-btn" class="btn btn-danger mt-3">Eliminar último producto</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
